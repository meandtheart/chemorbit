<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemorbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1E2A22;
    --ink-soft:#4B5850;
    --paper:#F1F2EC;
    --panel:#FFFFFF;
    --line:#D8DACE;
    --accent:#3F6B4A;
    --accent-dark:#2C4E35;
    --brass:#A6764A;
    --danger:#A23B33;
    --danger-bg:#F6E9E7;
    --success-bg:#E9F0EA;
    --brass-bg:#F3EAE0;
    --radius:3px;
    --shadow:0 1px 2px rgba(30,42,34,0.06), 0 4px 14px rgba(30,42,34,0.05);
    --flame:#D97D45;
    --glass-hi:rgba(255,255,255,0.65);
    --bond-line:rgba(166,118,74,0.4);
    --molecule-line:rgba(63,107,74,0.16);
  }
  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; }
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  #app{ position:relative; z-index:1; }

  /* ---- Molecule field: a quiet drift of atoms across every screen, like a ----
     ---- classroom chalkboard that never quite stops moving ---- */
  .molecule-field{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .molecule-field .mol{ position:absolute; opacity:0.5; animation:molDrift linear infinite; will-change:transform; }
  .molecule-field .mol svg{ display:block; }
  .molecule-field .mol .bond{ stroke:var(--molecule-line); stroke-width:1.3; }
  .molecule-field .mol .atom{ fill:var(--molecule-line); }
  @keyframes molDrift{
    0%{ transform:translate(0,0) rotate(0deg); }
    50%{ transform:translate(14px,-18px) rotate(8deg); }
    100%{ transform:translate(0,0) rotate(0deg); }
  }
  @media (prefers-reduced-motion: reduce){ .molecule-field .mol{ animation:none !important; } }
  @media (max-width:800px){ .molecule-field .mol{ opacity:0.34; } }
  *:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  h1,h2,h3,h4{
    font-family:'Spectral', Georgia, serif;
    font-weight:600;
    margin:0 0 0.3em 0;
    color:var(--ink);
    letter-spacing:0.01em;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }
  a{ color:var(--accent-dark); }
  button{ font-family:inherit; cursor:pointer; }
  input,select,textarea{ font-family:inherit; font-size:14px; }

  /* ---- Orbit mark ---- */
  .orbit-mark{ display:inline-flex; align-items:center; gap:10px; }
  .orbit-mark svg{ display:block; overflow:visible; }
  .orbit-word{ font-family:'Spectral', serif; font-weight:700; font-size:20px; letter-spacing:0.02em; color:var(--ink); }
  .orbit-word .dot{ color:var(--brass); }
  .orbit-dot{
    offset-path: path('M 37 20 A 17 8 0 1 1 3 20 A 17 8 0 1 1 37 20');
    offset-rotate: 0deg;
    animation: orbit-travel 7s linear infinite;
  }
  @keyframes orbit-travel{ from{ offset-distance:0%; } to{ offset-distance:100%; } }
  @media (prefers-reduced-motion: reduce){
    .orbit-dot{ animation:none !important; offset-distance:0% !important; }
  }

  /* ---- Landing hero: entering the world of chemistry ---- */
  :root{
    --hero-1:#0E1A13;
    --hero-2:#152318;
    --hero-line: rgba(233,240,234,0.4);
    --hero-electron:#E7B876;
  }
  .hero{
    position:relative; overflow:hidden;
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:60px 20px 120px;
    background: linear-gradient(180deg, var(--hero-1) 0%, var(--hero-2) 62%, var(--paper) 100%);
    color:#F2F1E9;
  }
  .hero-bg{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .hero-ring{
    position:absolute; top:14%; right:8%; width:180px; height:180px;
    border:1.5px solid rgba(231,184,118,0.18); border-radius:50%;
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
    animation: heroRingSpin 46s linear infinite;
  }
  .hero-ring::after{
    content:''; position:absolute; inset:14px;
    border:1.5px solid rgba(231,184,118,0.12);
    clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
  }
  @keyframes heroRingSpin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
  .bubble{
    position:absolute; bottom:-30px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,0.5), rgba(143,199,155,0.08));
    animation-name: bubbleRise; animation-timing-function:ease-in; animation-iteration-count:infinite;
  }
  @keyframes bubbleRise{
    0%{ transform:translateY(0) scale(1); opacity:0; }
    10%{ opacity:.7; }
    85%{ opacity:.35; }
    100%{ transform:translateY(-110vh) scale(1.15); opacity:0; }
  }
  .hero-atom{ position:relative; z-index:1; margin-bottom:18px; filter:drop-shadow(0 0 26px rgba(143,199,155,0.18)); }
  .hero-atom .nucleus{ animation: nucleusPulse 3.4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes nucleusPulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.14); opacity:.85; } }
  .hero-electron{
    offset-rotate:0deg; animation-name:heroElectronTravel; animation-timing-function:linear; animation-iteration-count:infinite;
    filter:drop-shadow(0 0 4px rgba(231,184,118,0.8));
  }
  @keyframes heroElectronTravel{ from{ offset-distance:0%; } to{ offset-distance:100%; } }
  .hero-title{ position:relative; z-index:1; font-size:clamp(34px,7vw,54px); color:#fff; margin-bottom:10px; animation:heroFadeUp .8s ease both; }
  .hero-title .dot{ color:var(--hero-electron); }
  .hero-tag{ position:relative; z-index:1; color:#C9D4C9; font-size:14.5px; max-width:380px; margin:0 0 30px; animation:heroFadeUp .8s .12s ease both; }
  @keyframes heroFadeUp{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
  .hero-cta{
    position:relative; z-index:1; display:inline-flex; align-items:center; gap:8px;
    background:rgba(242,241,233,0.08); border:1px solid rgba(242,241,233,0.35); color:#fff;
    padding:12px 22px; border-radius:30px; font-size:13.5px; letter-spacing:0.03em;
    transition:background .18s ease, transform .15s ease; animation:heroFadeUp .8s .22s ease both;
  }
  .hero-cta:hover{ background:rgba(242,241,233,0.16); }
  .hero-cta:active{ transform:translateY(1px); }
  .hero-cta-arrow{ display:inline-block; animation:heroArrowBob 1.6s ease-in-out infinite; }
  @keyframes heroArrowBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(3px); } }
  @media (prefers-reduced-motion: reduce){
    .hero-ring, .bubble, .hero-atom .nucleus, .hero-electron, .hero-cta-arrow{ animation:none !important; }
  }
  @media (max-width:640px){ .hero{ padding:50px 18px 100px; } .hero-atom svg{ width:220px; height:220px; } }

  /* ---- Auth section (post-hero, calm/light) ---- */
  .auth-section{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:56px 20px 60px; background:var(--paper);
  }
  .auth-card{
    width:100%; max-width:440px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:36px 34px 30px;
  }
  .auth-header{ text-align:center; margin-bottom:26px; }
  .auth-header p{ color:var(--ink-soft); margin:8px 0 0; font-size:13.5px; }

  .teacher-entry-wrap{ text-align:center; margin-top:26px; }
  .teacher-entry-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:#1B2A20; border:1.5px dashed rgba(255,255,255,0.35); color:#EDEDE6;
    padding:9px 20px; border-radius:5px; font-family:'Caveat', cursive; font-weight:700; font-size:20px;
    transform:rotate(-1.1deg); transition:background .15s ease, transform .15s ease;
  }
  .teacher-entry-btn:hover{ background:#233523; transform:rotate(-1.1deg) translateY(-1px); }
  .teacher-entry-btn:active{ transform:rotate(-1.1deg) translateY(0px); }
  .teacher-entry-btn svg{ width:18px; height:18px; flex-shrink:0; }
  .teacher-entry-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:8px; letter-spacing:0.02em; }

  /* ---- Chalkboard teacher-login modal ---- */
  .chalk-card{ background:#1B2A20 !important; border:1.5px dashed rgba(255,255,255,0.32); }
  .chalk-card .chalk-heading{ font-family:'Caveat', cursive; font-weight:700; font-size:32px; color:#fff; margin-bottom:2px; }
  .chalk-card .field label{ color:#B9C4BB; }
  .chalk-card .field input{ background:rgba(255,255,255,0.06); border-color:rgba(255,255,255,0.25); color:#fff; }
  .chalk-card .field input:focus{ border-color:var(--hero-electron); box-shadow:0 0 0 3px rgba(231,184,118,0.2); }
  .chalk-card .btn-ghost{ border-color:rgba(255,255,255,0.3); color:#EDEDE6; }

  .subtab{ display:flex; gap:18px; margin-bottom:20px; border-bottom:1px solid var(--line); }
  .subtab button{ background:none; border:none; padding:8px 2px 10px; font-size:13.5px; color:var(--ink-soft); border-bottom:2px solid transparent; margin-bottom:-1px; }
  .subtab button.active{ color:var(--ink); border-bottom-color:var(--accent); font-weight:600; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; letter-spacing:0.02em; text-transform:uppercase; }
  .field input, .field select, .field textarea{
    width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:var(--radius);
    background:#fff; color:var(--ink); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(63,107,74,0.12); }
  .field-hint{ font-size:12px; color:var(--ink-soft); margin-top:4px; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 18px; border-radius:var(--radius); border:1px solid var(--ink);
    background:var(--ink); color:#fff; font-size:13.5px; font-weight:500; letter-spacing:0.02em;
    transition:opacity .15s ease;
  }
  .btn:hover{ opacity:0.86; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-block{ width:100%; }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-accent{ background:var(--accent); border-color:var(--accent); }
  .btn-danger{ background:var(--danger); border-color:var(--danger); }
  .btn-sm{ padding:6px 12px; font-size:12.5px; }

  .error-box{ background:var(--danger-bg); color:var(--danger); border:1px solid #e3c6c2; padding:10px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:16px; }
  .hint-box{ background:var(--success-bg); color:var(--accent-dark); border:1px solid #cfe0d2; padding:10px 12px; border-radius:var(--radius); font-size:12.5px; margin-top:16px; }

  /* ---- App shell (post-login) ---- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:220px; flex-shrink:0; background:var(--ink); color:#EFEDE6;
    display:flex; flex-direction:column; padding:24px 18px;
  }
  .sidebar .orbit-word, .sidebar .orbit-mark{ color:#fff; }
  .sidebar .orbit-word{ color:#fff; }
  .sidebar-user{ margin:22px 0 24px; padding-bottom:18px; border-bottom:1px solid rgba(255,255,255,0.14); }
  .sidebar-user .name{ font-family:'Spectral', serif; font-weight:600; font-size:15px; color:#fff; }
  .sidebar-user .role{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:#B9C4BB; margin-top:2px; }
  .sidebar-nav{ position:relative; }
  .sidebar-nav::before{
    content:''; position:absolute; left:19px; top:8px; bottom:8px; width:1.5px;
    background:repeating-linear-gradient(180deg, var(--bond-line) 0 4px, transparent 4px 9px);
    z-index:0;
  }
  .nav-item{
    position:relative; display:flex; align-items:center; gap:9px; width:100%; text-align:left; background:none; border:none;
    color:#CDD5CB; padding:10px 10px; border-radius:var(--radius); font-size:13.5px; margin-bottom:2px;
    z-index:1;
  }
  .nav-item::before{
    content:''; position:absolute; left:9px; top:50%; width:5px; height:5px; border-radius:50%;
    background:var(--bond-line); transform:translate(-50%,-50%); transition:background .15s ease, box-shadow .15s ease;
  }
  .nav-item.active::before{ background:var(--brass); box-shadow:0 0 0 3px rgba(166,118,74,0.22); }
  .nav-icon{ display:flex; width:18px; height:18px; flex-shrink:0; margin-left:14px; }
  .nav-icon svg{ width:100%; height:100%; }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav-item.active{ background:rgba(255,255,255,0.1); color:#fff; }
  .nav-item.active .nav-icon{ color:var(--brass); }
  .nav-item{ transition:background .15s ease, color .15s ease; }
  .sidebar-foot{ margin-top:auto; padding-top:16px; border-top:1px solid rgba(255,255,255,0.14); }
  .logout-btn{ background:none; border:1px solid rgba(255,255,255,0.22); color:#D8DDD3; width:100%; padding:9px; border-radius:var(--radius); font-size:12.5px; }
  .logout-btn:hover{ background:rgba(255,255,255,0.08); }

  .main{ flex:1; min-width:0; padding:34px 40px 60px; }
  .main-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:10px; }
  .main-header .eyebrow{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin-bottom:4px; }
  .content{ max-width:960px; }

  /* mobile bottom app-bar */
  .mobile-tabs{ display:none; }

  @media (max-width: 800px){
    .shell{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; padding:14px 16px; flex-wrap:wrap; }
    .sidebar .orbit-mark{ margin-right:auto; }
    .sidebar-user{ display:none; }
    .sidebar-nav{ display:none; }
    .sidebar-foot{ margin:0; padding:0; border:none; width:auto; }
    .logout-btn{ width:auto; padding:7px 12px; }

    /* bottom app-bar: relative positioning so the sliding indicator can be absolute inside it */
    .mobile-tabs{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20;
      background:var(--ink); border-top:1px solid rgba(255,255,255,0.1);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      box-shadow:0 -6px 20px rgba(14,26,19,0.28);
    }
    .mobile-tabs button{
      position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
      background:none; border:none; padding:6px 2px; border-radius:8px;
      font-size:10.5px; color:#9AA79D; transition:color .15s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .mobile-tabs button .nav-icon{ width:20px; height:20px; transition:transform .28s cubic-bezier(.34,1.56,.64,1); }
    .mobile-tabs button.active{ color:var(--hero-electron); }
    .mobile-tabs button.active .nav-icon{ transform:translateY(-1px) scale(1.08); }
    .mobile-tabs button.just-tapped .nav-icon{ animation:tabBounce .38s cubic-bezier(.34,1.56,.64,1); }
    @keyframes tabBounce{ 0%{ transform:scale(1); } 35%{ transform:scale(0.78); } 100%{ transform:scale(1.08) translateY(-1px); } }
    .tab-indicator{
      position:absolute; top:2px; height:calc(100% - 4px); border-radius:10px;
      background:rgba(231,184,118,0.14); z-index:-1;
      transition:transform .32s cubic-bezier(.34,1.2,.4,1), width .32s cubic-bezier(.34,1.2,.4,1);
      pointer-events:none;
    }

    .main{ padding:18px 16px calc(76px + env(safe-area-inset-bottom)); }

    /* directional slide transitions between mobile tabs (nav-order aware) */
    .content{ animation:contentFade .28s ease; }
    .content.dir-fwd{ animation:slideInFwd .32s cubic-bezier(.22,.9,.36,1) both; }
    .content.dir-back{ animation:slideInBack .32s cubic-bezier(.22,.9,.36,1) both; }
    @keyframes slideInFwd{ from{ opacity:0; transform:translateX(28px); } to{ opacity:1; transform:translateX(0); } }
    @keyframes slideInBack{ from{ opacity:0; transform:translateX(-28px); } to{ opacity:1; transform:translateX(0); } }

    /* touch press-feedback: cards and options tighten slightly under a tap, like paper flexing */
    .card:active, .stat-card:active, .exam-opt:active, table tr:active{ transform:scale(0.985); transition:transform .1s ease; }
    .card, .stat-card, .exam-opt{ transition:transform .12s ease; }
    .mobile-tabs button:active .nav-icon{ transform:scale(0.85); }

    /* responsive tables -> stacked cards, so nothing overflows a phone width */
    .card table thead{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
    .card table, .card table tbody, .card table tr, .card table td{ display:block; width:100%; }
    .card table{ border-collapse:separate; border-spacing:0 8px; margin-top:-8px; }
    .card table tr{ border:1px solid var(--line); border-radius:var(--radius); padding:4px 12px; background:#FCFCFA; }
    .card table tr.top-row{ background:var(--brass-bg); border-color:var(--brass); }
    .card table td{ border-bottom:1px dashed #EAE8DF; padding:8px 0; display:flex; justify-content:space-between; align-items:center; gap:14px; text-align:right; }
    .card table tr td:last-child{ border-bottom:none; }
    .card table td[data-label=""]{ justify-content:flex-end; }
    .card table td::before{
      content:attr(data-label); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
      color:var(--ink-soft); font-weight:600; text-align:left; flex-shrink:0;
    }
    .card table td[data-label=""]::before{ content:none; }

    /* bottom-sheet modals: slide up from the bottom edge like a native app */
    .modal-overlay{ align-items:flex-end; padding:0; }
    .modal-card{ max-width:none; width:100%; border-radius:20px 20px 0 0; padding:14px 22px calc(26px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .28s cubic-bezier(.22,.9,.32,1); box-shadow:0 -12px 40px rgba(0,0,0,0.22); }
    .modal-overlay.show .modal-card{ transform:translateY(0); }
    .modal-card::before{ content:''; display:block; width:36px; height:4px; border-radius:3px; background:var(--line); margin:0 auto 16px; }
  }

  @media (hover:hover) and (pointer:fine){
    .stat-card{ transition:transform .15s ease, box-shadow .15s ease; }
    .stat-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow); }
    tbody tr{ transition:background .12s ease; }
    tbody tr:hover td{ background:#FAFAF6; }
  }
  .btn{ position:relative; overflow:visible; transition:opacity .15s ease, transform .08s ease, box-shadow .15s ease; }
  .btn:active{ transform:translateY(1px); }
  .fizz-spark{
    position:fixed; width:5px; height:5px; border-radius:50%; background:var(--hero-electron);
    pointer-events:none; z-index:400; animation:fizzPop .5s ease-out forwards;
  }
  @keyframes fizzPop{
    0%{ transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(var(--fx), var(--fy)) scale(0.3); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){ .fizz-spark{ display:none; } }

  /* ---- Cards / tables / badges: glassware on the lab bench ---- */
  .card{
    position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px 24px; margin-bottom:18px; box-shadow:var(--shadow); overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--accent) 0%, var(--brass) 100%); opacity:0.75;
  }
  .card::after{
    content:''; position:absolute; top:3px; left:0; right:0; height:34px;
    background:linear-gradient(180deg, var(--glass-hi) 0%, rgba(255,255,255,0) 100%); opacity:0.35; pointer-events:none;
  }
  .card-title{ position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:22px; }
  .stat-card{
    position:relative; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px 16px 22px; overflow:hidden;
  }
  .stat-card::before{ content:''; position:absolute; top:0; bottom:0; left:0; width:4px; background:var(--brass); opacity:0.7; }
  .stat-card .label{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); margin-bottom:8px; }
  .stat-card .value{ font-family:'Spectral', serif; font-size:26px; font-weight:600; }
  .stat-card .sub{ font-size:12px; color:var(--ink-soft); margin-top:3px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); }
  td{ padding:10px 10px; border-bottom:1px solid #EAE8DF; vertical-align:middle; }

/* Switches views with direction awareness, so the mobile shell can slide the
   right way and the bottom-tab pill knows which way to travel. */
function navigateTo(key){
  if(key===view) return;
  const oldIdx = currentNavOrder.indexOf(view);
  const newIdx = currentNavOrder.indexOf(key);
  navDirection = (oldIdx>-1 && newIdx>-1) ? (newIdx>oldIdx?'fwd':'back') : null;
  view = key;
  vibrate(8);
  render();
}

/* FLIP-style slide for the bottom-tab active pill: capture the outgoing
   button's box before the shell is torn down, then animate the new pill
   from that box to its real position once the fresh DOM lands. */
function captureTabIndicatorRect(){
  const bar = document.querySelector('.mobile-tabs');
  const active = bar && bar.querySelector('button.active');
  if(!bar || !active){ lastTabIndicatorRect = null; return; }
  const barRect = bar.getBoundingClientRect(), btnRect = active.getBoundingClientRect();
  lastTabIndicatorRect = { left: btnRect.left-barRect.left, width: btnRect.width };
}
function positionTabIndicator(){
  const bar = document.querySelector('.mobile-tabs');
  const active = bar && bar.querySelector('button.active');
  if(!bar || !active) return;
  let indicator = bar.querySelector('.tab-indicator');
  if(!indicator){ indicator = document.createElement('div'); indicator.className='tab-indicator'; bar.appendChild(indicator); }
  const barRect = bar.getBoundingClientRect(), btnRect = active.getBoundingClientRect();
  const left = btnRect.left-barRect.left, width = btnRect.width;
  const from = lastTabIndicatorRect;
  lastTabIndicatorRect = null;
  indicator.style.transition = 'none';
  indicator.style.transform = `translateX(${(from||{left}).left}px)`;
  indicator.style.width = (from||{width}).width+'px';
  indicator.offsetWidth; // force reflow so the jump above doesn't animate
  indicator.style.transition = '';
  requestAnimationFrame(()=>{
    indicator.style.transform = `translateX(${left}px)`;
    indicator.style.width = width+'px';
  });
}

/* Bottom-sheet modals: drag the sheet down past a threshold to dismiss,
   like a native app. Only active at phone widths — desktop modals are
   centered and don't drag. */
function enableSheetDrag(card, onDismiss){
  let startY=0, dy=0, dragging=false;
  card.addEventListener('touchstart', (e)=>{
    if(window.innerWidth>800) return;
    startY = e.touches[0].clientY; dy=0; dragging=true;
    card.style.transition='none';
  }, {passive:true});
  card.addEventListener('touchmove', (e)=>{
    if(!dragging) return;
    dy = Math.max(0, e.touches[0].clientY-startY);
    card.style.transform = `translateY(${dy}px)`;
  }, {passive:true});
  card.addEventListener('touchend', ()=>{
    if(!dragging) return; dragging=false;
    card.style.transition='';
    if(dy>90) onDismiss(); else card.style.transform='';
  });
}

/* ---- Hero: an atom model with electrons on real elliptical orbits ---- */
function heroAtomSVG(){
  const orbits = [0, 60, 120]; // classic 3-ellipse atom symbol
  const speeds = [9, 12, 15];
  const delays = [0, -4, -8];
  const cx=150, cy=150, rx=112, ry=48;
  const pathFor = ()=> `M ${cx+rx} ${cy} A ${rx} ${ry} 0 1 1 ${cx-rx} ${cy} A ${rx} ${ry} 0 1 1 ${cx+rx} ${cy}`;
  const rings = orbits.map((deg,i)=>`
    <g transform="rotate(${deg} ${cx} ${cy})">
      <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="var(--hero-line)" stroke-width="1.1"/>

        style="offset-path: path('${pathFor()}'); animation-duration:${speeds[i]}s; animation-delay:${delays[i]}s;"/>
    </g>`).join('');
  return `<svg width="260" height="260" viewBox="0 0 300 300" fill="none">
    ${rings}
    <circle class="nucleus" cx="150" cy="150" r="12" fill="#8FC79B"/>
  </svg>`;
}
/* Scatters a handful of small molecule clusters across the viewport, once.
   Each is a tiny cluster of 2-4 bonded atoms, sized/rotated/timed differently
   so the drift never looks synchronized. Pure decoration, never re-rendered. */
function initMoleculeField(){
  const field = document.getElementById('molecule-field');
  if(!field) return;
  const shapes = [
    `<svg width="46" height="34" viewBox="0 0 46 34"><line class="bond" x1="8" y1="17" x2="30" y2="8"/><line class="bond" x1="8" y1="17" x2="30" y2="26"/><circle class="atom" cx="8" cy="17" r="4"/><circle class="atom" cx="30" cy="8" r="3"/><circle class="atom" cx="30" cy="26" r="3"/></svg>`,
    `<svg width="30" height="30" viewBox="0 0 30 30"><line class="bond" x1="7" y1="15" x2="23" y2="15"/><circle class="atom" cx="7" cy="15" r="3.4"/><circle class="atom" cx="23" cy="15" r="3.4"/></svg>`,
    `<svg width="52" height="40" viewBox="0 0 52 40"><line class="bond" x1="10" y1="20" x2="26" y2="8"/><line class="bond" x1="10" y1="20" x2="26" y2="32"/><line class="bond" x1="26" y1="8" x2="42" y2="16"/><circle class="atom" cx="10" cy="20" r="4.4"/><circle class="atom" cx="26" cy="8" r="3"/><circle class="atom" cx="26" cy="32" r="3"/><circle class="atom" cx="42" cy="16" r="2.6"/></svg>`,
    `<svg width="22" height="22" viewBox="0 0 22 22"><circle class="atom" cx="11" cy="11" r="4"/></svg>`,
  ];
  const positions = [
    {top:'8%', left:'6%'}, {top:'18%', left:'82%'}, {top:'42%', left:'12%'},
    {top:'62%', left:'88%'}, {top:'78%', left:'20%'}, {top:'30%', left:'48%'},
    {top:'88%', left:'55%'}, {top:'5%', left:'55%'}, {top:'55%', left:'68%'},
  ];
  let html = '';
  positions.forEach((pos, i)=>{
    const shape = shapes[i % shapes.length];
    const dur = 16 + (i*5 % 14);
    const delay = -(i*3 % 12);
    html += `<span class="mol" style="top:${pos.top}; left:${pos.left}; animation-duration:${dur}s; animation-delay:${delay}s;">${shape}</span>`;
  });
  field.innerHTML = html;
}

function bubblesHTML(count){
  let out = '';
  for(let i=0;i<count;i++){
    const left = (i*67 % 100);
    const size = 5 + (i*13 % 14);
    const dur = 9 + (i*7 % 10);
    const delay = -(i*3 % 12);
    out += `<span class="bubble" style="left:${left}%; width:${size}px; height:${size}px; animation-duration:${dur}s; animation-delay:${delay}s;"></span>`;
  }
  return out;
}

/* ============================= TOASTS / MODAL ============================= */
function toast(msg, tone){
  let wrap = document.getElementById('toast-wrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.id='toast-wrap'; wrap.className='toast-wrap'; document.body.appendChild(wrap); }
  const el = document.createElement('div');
  el.className = 'toast'+(tone?' toast-'+tone:'');
  el.textContent = msg;
  wrap.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=> el.remove(), 250); }, 2800);
}

function showConfirm(title, message, confirmLabel){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <h3>${esc(title)}</h3>
        <p class="field-hint" style="margin:8px 0 20px; font-size:13px;">${esc(message)}</p>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
          <button class="btn btn-ghost" id="modal-cancel" type="button">Cancel</button>
          <button class="btn btn-accent" id="modal-confirm" type="button">${esc(confirmLabel||'Confirm')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    requestAnimationFrame(()=> overlay.classList.add('show'));
    function close(result){
      overlay.classList.remove('show');
      setTimeout(()=> overlay.remove(), 200);
      resolve(result);
    }
    overlay.querySelector('#modal-cancel').onclick = ()=>close(false);
    overlay.querySelector('#modal-confirm').onclick = ()=>close(true);
    overlay.onclick = (e)=>{ if(e.target===overlay) close(false); };
    enableSheetDrag(overlay.querySelector('.modal-card'), ()=>close(false));
  });
}

/* ============================= COUNT-UP STATS ============================= */
function animateCountUps(root){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  root.querySelectorAll('[data-countup]').forEach(el=>{
    const target = parseFloat(el.dataset.countup);
    const suffix = el.dataset.suffix || '';
    if(reduce || isNaN(target)){ el.textContent = (isNaN(target)?el.textContent:target)+suffix; return; }
    const dur = 550, start = performance.now();
    function step(now){
      const p = Math.min(1, (now-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      el.textContent = Math.round(target*eased)+suffix;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function bindAuthEvents(){
  const heroBtn = document.getElementById('hero-enter-btn');
  if(heroBtn) heroBtn.onclick = ()=>{
    document.getElementById('auth-section').scrollIntoView({behavior:'smooth', block:'start'});
  };
  const otl = document.getElementById('open-teacher-login');
  if(otl) otl.onclick = openTeacherLoginModal;

  document.querySelectorAll('.subtab button').forEach(b=>{
    b.onclick = ()=>{ authTab=b.dataset.tab; render(); document.getElementById('auth-section').scrollIntoView({block:'start'}); };
  });
  const showErr = (msg)=>{ document.getElementById('auth-error').innerHTML = `<div class="error-box">${esc(msg)}</div>`; };

  const slf = document.getElementById('student-login-form');
  if(slf) slf.onsubmit = async (e)=>{
    e.preventDefault();
    const username = document.getElementById('li-username').value.trim();
    const password = document.getElementById('li-password').value;
    const { data: u, error } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('username', username)
      .maybeSingle();

    if(error || !u || u.role !== 'student' || u.password !== password){
      showErr('No matching student account. Check your username and password.');
      return;
    }
    session = { username:u.username, name:u.full_name, role:'student', batch:u.batch };
    view = 'dashboard';
    render();
  };

  const ssf = document.getElementById('student-signup-form');
  if(ssf) ssf.onsubmit = async (e)=>{
    e.preventDefault();
    const name = document.getElementById('su-name').value.trim();
    const username = document.getElementById('su-username').value.trim();
    const password = document.getElementById('su-password').value;
    const phone = document.getElementById('su-phone').value.trim();
    const batch = document.getElementById('su-batch').value.trim();
    if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){ showErr('Username must be 3-20 letters, numbers or underscores.'); return; }
    if(username.toLowerCase()==='sir'){ showErr('That username is reserved. Please choose another.'); return; }
    const { error } = await supabaseClient
      .from('profiles')
      .insert([{ username, password, full_name: name, phone, batch, role: 'student' }]);

    if(error){ showErr('Could not create account: ' + error.message); return; }
    session = { username, name, role:'student', batch };
    view = 'dashboard';
    render();
    toast(`Welcome to Chemorbit, ${name.split(' ')[0]}.`, 'success');
  };
}

      <span class="nav-icon">${NAV_ICONS[n.key]||''}</span><span>${esc(n.label)}</span>
    </button>`).join('');

  return `
  <div class="shell">
    <div class="sidebar">
      <div class="orbit-mark">${orbitSVG(24,'#fff')}<span class="orbit-word" style="color:#fff">Chem<span class="dot">orbit</span></span></div>
      <div class="sidebar-user">
        <div class="name">${esc(session.name)}</div>

function bindShellNav(navKeys){

async function studentDashboardHTML(){
  const [exams, allAtt, payment] = await Promise.all([ allExams(), allAttendanceRecords(), paymentFor(session.username) ]);
  let subs = [];
  for(const ex of exams){ const s = await submissionFor(ex.id, session.username); if(s) subs.push({...s, examTitle:ex.title}); }

  const distinctDates = new Set(allAtt.map(r=>r.date));
  const mine = allAtt.filter(r=>r.username===session.username && r.present);
  const totalHeld = distinctDates.size;
  const attended = mine.length;

  const avgScorePct = subs.length ? Math.round(100*subs.reduce((a,s)=>a+(s.score/s.total),0)/subs.length) : null;
  const paid = payment && payment.paid;

  return `
    <div class="main-header">
      <div><div class="eyebrow">Overview</div><h2>Welcome back, ${esc(session.name.split(' ')[0])}</h2></div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Exams taken</div><div class="value" data-countup="${subs.length}">0</div><div class="sub">of ${exams.length} published</div></div>
      <div class="stat-card"><div class="label">Average score</div><div class="value" ${avgScorePct===null?'':`data-countup="${avgScorePct}" data-suffix="%"`}>${avgScorePct===null?'&mdash;':'0%'}</div><div class="sub">across attempted exams</div></div>
      <div class="stat-card"><div class="label">Classes attended</div><div class="value" data-countup="${attended}">0</div><div class="sub">of ${totalHeld} held</div></div>
      <div class="stat-card"><div class="label">Payment status</div><div class="value" style="font-size:18px;"><span class="badge ${paid?'badge-paid':'badge-due'}">${paid?'Paid':'Due'}</span></div><div class="sub">${payment&&payment.updated_at? 'Updated '+fmtWhen(payment.updated_at) : 'Not yet reviewed'}</div></div>
    </div>
    <div class="card">
      <div class="card-title"><h3>Exam results</h3></div>
      ${subs.length===0 ? `<div class="empty">No exams attempted yet &mdash; check the Exam room.</div>` : `
      <table><thead><tr><th>Exam</th><th>Score</th><th>Submitted</th></tr></thead><tbody>
        ${subs.sort((a,b)=>(b.submittedAt||'').localeCompare(a.submittedAt||'')).map(s=>`
          <tr><td data-label="Exam">${esc(s.examTitle)}</td><td class="mono" data-label="Score">${s.score} / ${s.total}</td><td data-label="Submitted">${fmtWhen(s.submittedAt)}</td></tr>
        `).join('')}
      </tbody></table>`}
    </div>`;
}

async function studentExamRoomHTML(){

      <p class="field-hint" style="margin-bottom:18px;">Answer what you can &mdash; leaving a question blank counts as skipped, not wrong. You can only submit once.</p>
      <form id="exam-take-form" data-total="${ex.questions.length}">

async function studentAttendanceHTML(){
  const allAtt = await allAttendanceRecords();
  const distinctDates = [...new Set(allAtt.map(r=>r.date))].sort().reverse();
  const mine = allAtt.filter(r=>r.username===session.username && r.present).map(r=>r.date).sort().reverse();
  const markedToday = mine.includes(todayISO());
  return `
    <div class="main-header"><div><div class="eyebrow">Attendance</div><h2>Today &mdash; ${fmtDate(todayISO())}</h2></div></div>
    <div class="card">
      ${markedToday
        ? `<p><span class="badge badge-present">Marked present</span> &nbsp;You're checked in for today's class.</p>`
        : `<p class="field-hint" style="margin-bottom:14px;">Mark yourself present once you've joined today's batch.</p>
           <button class="btn btn-accent" id="mark-present-btn">Mark present for today</button>`}
    </div>
    <div class="card">
      <div class="card-title"><h3>History</h3><div class="field-hint">${mine.length} of ${distinctDates.length} classes held</div></div>

function bindStudentContentEvents(){
  document.querySelectorAll('[data-view]').forEach(b=>{ b.onclick = ()=>{ navigateTo(b.dataset.view); }; });
  document.querySelectorAll('[data-start]').forEach(b=>{
    b.onclick = ()=>{ examTakeId=b.dataset.start; view='examTake'; navDirection=null; render(); };
  });
  const mpb = document.getElementById('mark-present-btn');
  if(mpb) mpb.onclick = async ()=>{
    mpb.disabled = true; mpb.textContent='Marking...';
    const { error } = await supabaseClient
      .from('attendance')
      .upsert([{ date: todayISO(), username: session.username, present: true, time: new Date().toISOString() }], { onConflict: 'date,username' });
    if(error){ console.error('Attendance mark error:', error); toast('Could not mark attendance — please try again.', 'error'); render(); return; }
    vibrate(15);
    toast('Marked present for today.', 'success');
    render();
  };

  const etf = document.getElementById('exam-take-form');
  if(etf){
    const totalQ = parseInt(etf.dataset.total,10) || 0;
    const updateProgress = ()=>{
      const answered = new Set();
      etf.querySelectorAll('input[type=radio]:checked').forEach(r=>answered.add(r.name));
      const n = answered.size;
      const fill = document.getElementById('exam-progress-fill');
      const label = document.getElementById('exam-progress-label');
      if(fill) fill.style.width = (totalQ ? (100*n/totalQ) : 0)+'%';
      if(label) label.textContent = n+' of '+totalQ+' answered';
    };
    etf.addEventListener('change', (e)=>{
      if(e.target.matches('input[type=radio]')){
        etf.querySelectorAll(`input[name="${e.target.name}"]`).forEach(r=>{
          const opt = r.closest('.exam-opt'); if(opt) opt.classList.toggle('is-selected', r.checked);
        });
        updateProgress();
      }
    });
    updateProgress();

    etf.onsubmit = async (e)=>{
      e.preventDefault();
      const ok = await showConfirm('Submit this exam?', 'You can only submit once — this locks in your answers.', 'Submit exam');
      if(!ok) return;
      const ex = await examById(examTakeId);
      const answers = {};
      let score = 0;
      ex.questions.forEach((q,i)=>{
        const sel = etf.querySelector(`input[name="q${i}"]:checked`);
        const val = sel ? parseInt(sel.value,10) : null;
        answers['q'+i] = val;
        if(val===q.correct) score++;
      });
      const { error } = await supabaseClient
        .from('submissions')
        .insert([{
          exam_id: examTakeId,
          username: session.username,
          answers: answers,
          score: score,
          total: ex.questions.length
        }]);

      if(error){ console.error('Submission error:', error); toast('Could not submit — please try again.', 'error'); return; }
      toast(`Submitted — you scored ${score}/${ex.questions.length}.`, 'success');
      view='exam'; examTakeId=null; render();
    };
  }
}

function teacherPublishHTML(){
  const qhtml = draftQuestions.map((q,qi)=>`
    <div class="question-block" data-qi="${qi}">
      <div class="qnum">QUESTION ${qi+1}</div>
      <div class="field"><textarea class="q-text" rows="2" data-qi="${qi}" placeholder="Question text">${esc(q.text)}</textarea></div>
      ${q.options.map((op,oi)=>`
        <div class="opt-row">
          <span class="opt-label">${String.fromCharCode(65+oi)}</span>
          <input type="text" class="q-opt" data-qi="${qi}" data-oi="${oi}" value="${esc(op)}" placeholder="Option ${String.fromCharCode(65+oi)}">
          <input type="radio" class="q-correct" name="correct-${qi}" data-qi="${qi}" value="${oi}" ${q.correct===oi?'checked':''} title="Correct answer">

    </div>`).join('');

  return `
    <div class="main-header"><div><div class="eyebrow">Publish</div><h2>New MCQ exam</h2></div></div>
    <div class="card">
      <div class="field-row">
        <div class="field"><label>Exam title</label><input type="text" id="exam-title" placeholder="e.g. Organic Chemistry &ndash; Ch. 4"></div>
        <div class="field"><label>Subject / topic (optional)</label><input type="text" id="exam-subject" placeholder="e.g. Hydrocarbons"></div>
      </div>
    </div>
    <div id="questions-wrap">${qhtml}</div>
    <button type="button" class="btn btn-ghost" id="add-question-btn" style="margin-bottom:20px;">+ Add question</button>
    <div>
      <button type="button" class="btn btn-accent" id="publish-exam-btn">Publish exam</button>
    </div>
    <div id="publish-error"></div>`;
}

async function teacherResultsHTML(){
  const exams = await allExams();
  if(exams.length===0) return `<div class="main-header"><div><div class="eyebrow">Results</div><h2>Exam results</h2></div></div><div class="card"><div class="empty">Publish an exam first to see results here.</div></div>`;
  if(!resultsExamId) resultsExamId = exams[0].id;
  const exam = exams.find(e=>e.id===resultsExamId) || exams[0];
  const subs = await submissionsForExam(exam.id);
  const students = await allStudents();
  const nameOf = (u)=> (students.find(s=>s.username===u)||{}).name || u;

  const optionsHTML = exams.map(e=>`<option value="${e.id}" ${e.id===exam.id?'selected':''}>${esc(e.title)}</option>`).join('');

  if(subs.length===0){
    return `
    <div class="main-header"><div><div class="eyebrow">Results</div><h2>Exam results</h2></div></div>
    <div class="card"><label style="font-size:12.5px;color:var(--ink-soft);">Exam</label><select id="results-exam-select" style="width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);border-radius:3px;">${optionsHTML}</select></div>
    <div class="card"><div class="empty">No submissions yet for this exam.</div></div>`;
  }

  const max = Math.max(...subs.map(s=>s.score));
  const avg = (subs.reduce((a,s)=>a+s.score,0)/subs.length).toFixed(1);
  const sorted = [...subs].sort((a,b)=>b.score-a.score);

  // per-question wrong/skip analysis
  const qStats = exam.questions.map((q,i)=>({ i, text:q.text, wrong:0, skipped:0 }));
  subs.forEach(s=>{
    exam.questions.forEach((q,i)=>{
      const val = s.answers ? s.answers['q'+i] : undefined;
      if(val===null || val===undefined) qStats[i].skipped++;
      else if(val!==q.correct) qStats[i].wrong++;
    });
  });
  const topIssues = [...qStats].sort((a,b)=>(b.wrong+b.skipped)-(a.wrong+a.skipped)).slice(0,5);

  return `
    <div class="main-header"><div><div class="eyebrow">Results</div><h2>Exam results</h2></div></div>
    <div class="card"><label style="font-size:12.5px;color:var(--ink-soft);">Exam</label><select id="results-exam-select" style="width:100%;margin-top:6px;padding:9px;border:1px solid var(--line);border-radius:3px;">${optionsHTML}</select></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Submissions</div><div class="value" data-countup="${subs.length}">0</div><div class="sub">of ${students.length} students</div></div>
      <div class="stat-card"><div class="label">Highest mark</div><div class="value"><span data-countup="${max}">0</span> / ${exam.questions.length}</div></div>
      <div class="stat-card"><div class="label">Average mark</div><div class="value">${avg}</div></div>
    </div>
    <div class="card">
      <div class="card-title"><h3>Scoreboard</h3></div>
      <table><thead><tr><th>Student</th><th>Score</th><th>Submitted</th></tr></thead><tbody>
        ${sorted.map(s=>`<tr class="${s.score===max?'top-row':''}"><td data-label="Student">${esc(nameOf(s.username))} ${s.score===max?'<span class="badge badge-top">Top</span>':''}</td><td class="mono" data-label="Score">${s.score} / ${s.total}</td><td data-label="Submitted">${fmtWhen(s.submittedAt)}</td></tr>`).join('')}
      </tbody></table>
    </div>
    <div class="card">
      <div class="card-title"><h3>Most commonly missed</h3></div>
      <table><thead><tr><th>Question</th><th>Wrong</th><th>Skipped</th></tr></thead><tbody>
        ${topIssues.map(q=>`<tr><td data-label="Question">Q${q.i+1}. ${esc(q.text.length>60?q.text.slice(0,60)+'&hellip;':q.text)}</td><td class="mono" data-label="Wrong">${q.wrong}</td><td class="mono" data-label="Skipped">${q.skipped}</td></tr>`).join('')}
      </tbody></table>
    </div>`;
}

async function teacherAttendanceHTML(){
  const [students, allAtt] = await Promise.all([ allStudents(), allAttendanceRecords() ]);
  const distinctDates = [...new Set(allAtt.map(r=>r.date))];
  const totalHeld = distinctDates.length;
  const presentToday = new Set(allAtt.filter(r=>r.date===attDate && r.present).map(r=>r.username));

  const attendedCount = {};
  students.forEach(s=>attendedCount[s.username]=0);
  allAtt.forEach(r=>{ if(r.present && attendedCount[r.username]!==undefined) attendedCount[r.username]++; });

  return `
    <div class="main-header"><div><div class="eyebrow">Attendance</div><h2>Class register</h2></div></div>
    <div class="card">
      <div class="field-row" style="align-items:flex-end;">
        <div class="field" style="max-width:220px;"><label>Date</label><input type="date" id="att-date-input" value="${attDate}"></div>
        <div class="field-hint" style="padding-bottom:10px;">${presentToday.size} of ${students.length} present</div>
      </div>
      ${students.length===0 ? `<div class="empty">No students have signed up yet.</div>` : `
      <table><thead><tr><th>Student</th><th>Batch</th><th>Status</th></tr></thead><tbody>
        ${students.map(s=>`<tr><td data-label="Student">${esc(s.name)}</td><td data-label="Batch">${esc(s.batch||'&mdash;')}</td><td data-label="Status">${presentToday.has(s.username)?'<span class="badge badge-present">Present</span>':'<span class="badge badge-absent">Absent</span>'}</td></tr>`).join('')}
      </tbody></table>`}
    </div>
    <div class="card">
      <div class="card-title"><h3>Classes completed</h3><div class="field-hint">${totalHeld} classes held in total</div></div>
      ${students.length===0 ? `<div class="empty">Nothing to show yet.</div>` : `
      <table><thead><tr><th>Student</th><th>Attended</th></tr></thead><tbody>
        ${students.map(s=>`<tr><td data-label="Student">${esc(s.name)}</td><td class="mono" data-label="Attended">${attendedCount[s.username]} / ${totalHeld}</td></tr>`).join('')}
      </tbody></table>`}
    </div>`;
}

async function teacherPaymentsHTML(){
  const [students, paymentRows] = await Promise.all([ allStudents(), allPayments() ]);
  const payments = {};
  paymentRows.forEach(p => { payments[p.username] = p; });
  return `
    <div class="main-header"><div><div class="eyebrow">Payments</div><h2>Fee status</h2></div></div>
    <div class="card">
      ${students.length===0 ? `<div class="empty">No students have signed up yet.</div>` : `
      <table><thead><tr><th>Student</th><th>Batch</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody>
        ${students.map(s=>{
          const p = payments[s.username];
          const paid = p && p.paid;
          return `<tr>
            <td data-label="Student">${esc(s.name)}</td><td data-label="Batch">${esc(s.batch||'&mdash;')}</td>
            <td data-label="Status"><span class="badge ${paid?'badge-paid':'badge-due'}">${paid?'Paid':'Due'}</span></td>
            <td class="field-hint" data-label="Updated">${p&&p.updated_at?fmtWhen(p.updated_at):'&mdash;'}</td>
            <td data-label=""><button class="btn btn-ghost btn-sm" data-toggle-pay="${s.username}" data-current="${paid?1:0}">${paid?'Mark due':'Mark paid'}</button></td>
          </tr>`;
        }).join('')}
      </tbody></table>`}
    </div>`;
}

function syncDraftFromDOM(){
  document.querySelectorAll('.q-text').forEach(el=>{ draftQuestions[+el.dataset.qi].text = el.value; });
  document.querySelectorAll('.q-opt').forEach(el=>{ draftQuestions[+el.dataset.qi].options[+el.dataset.oi] = el.value; });
  document.querySelectorAll('.q-correct:checked').forEach(el=>{ draftQuestions[+el.dataset.qi].correct = +el.value; });
}

function bindTeacherContentEvents(){
  document.querySelectorAll('[data-view]').forEach(b=>{ b.onclick = ()=>{ navigateTo(b.dataset.view); }; });

  // publish exam view
  const addQBtn = document.getElementById('add-question-btn');
  if(addQBtn) addQBtn.onclick = ()=>{ syncDraftFromDOM(); draftQuestions.push(blankQuestion()); render(); };

  document.querySelectorAll('[data-remove-q]').forEach(b=>{
    b.onclick = ()=>{ syncDraftFromDOM(); draftQuestions.splice(+b.dataset.removeQ,1); render(); };
  });

  const pubBtn = document.getElementById('publish-exam-btn');
  if(pubBtn) pubBtn.onclick = async ()=>{
    syncDraftFromDOM();
    const title = document.getElementById('exam-title').value.trim();
    const subject = document.getElementById('exam-subject').value.trim();
    const errBox = document.getElementById('publish-error');
    if(!title){ errBox.innerHTML = `<div class="error-box">Give the exam a title.</div>`; return; }
    for(const q of draftQuestions){
      if(!q.text.trim() || q.options.some(o=>!o.trim())){
        errBox.innerHTML = `<div class="error-box">Every question needs its text and all four options filled in.</div>`; return;
      }
    }
const id = 'exam_' + Date.now();
const exam = { 
  id, 
  title, 
  subject, 
  questions: draftQuestions.map(q => ({
    text: q.text.trim(), 
    options: q.options.map(o => o.trim()), 
    correct: q.correct
  })), 
  published_by: session.username 
};

    const { error } = await supabaseClient
      .from('exams')
      .insert([exam]);

    if(error){ console.error('Publish error:', error); errBox.innerHTML = `<div class="error-box">Could not publish exam: ${esc(error.message)}</div>`; return; }
    draftQuestions = [ blankQuestion() ];
    resultsExamId = id;
    view='results';
    toast('Exam published — students can see it now.', 'success');
    render();
  };

  // results view
  const resSel = document.getElementById('results-exam-select');
  if(resSel) resSel.onchange = ()=>{ resultsExamId = resSel.value; render(); };

  // attendance view
  const dateInput = document.getElementById('att-date-input');
  if(dateInput) dateInput.onchange = ()=>{ attDate = dateInput.value; render(); };

  // payments view
  document.querySelectorAll('[data-toggle-pay]').forEach(b=>{
    b.onclick = async ()=>{
      const username = b.dataset.togglePay;
      const nowPaid = b.dataset.current==='1';
      const { error } = await supabaseClient
        .from('payments')
        .upsert([{ username, paid: !nowPaid, updated_at: new Date().toISOString() }], { onConflict: 'username' });
      if(error){ console.error('Payment toggle error:', error); toast('Could not update payment — please try again.', 'error'); render(); return; }
      toast(nowPaid ? 'Marked as due.' : 'Marked as paid.', 'success');
      render();
    };
  });
}

/* ============================= INIT ============================= */
/* A tiny reaction-fizz whenever a primary control is tapped — a handful of
   brass sparks radiating from the tap point, purely decorative, attached
   once via delegation so no existing button markup or handler changes. */
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.btn, .mobile-tabs button, .exam-opt');
  if(!btn) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const rect = btn.getBoundingClientRect();
  const x = e.clientX || (rect.left+rect.width/2), y = e.clientY || (rect.top+rect.height/2);
  const n = 5;
  for(let i=0;i<n;i++){
    const spark = document.createElement('span');
    spark.className = 'fizz-spark';
    const angle = (Math.PI*2*i/n) + Math.random()*0.6;
    const dist = 18 + Math.random()*16;
    spark.style.setProperty('--fx', (Math.cos(angle)*dist)+'px');
    spark.style.setProperty('--fy', (Math.sin(angle)*dist)+'px');
    spark.style.left = x+'px'; spark.style.top = y+'px';
    document.body.appendChild(spark);
    setTimeout(()=> spark.remove(), 520);
  }
}, true);

(function setupMobileSwipeNav(){
  let touchStartX=0, touchStartY=0, touchStartTime=0, swiping=false;
  document.addEventListener('touchstart', (e)=>{
    if(window.innerWidth>800 || !session || e.touches.length!==1) return;
    if(e.target.closest('button, a, input, select, textarea, .exam-opt, .modal-overlay')) return;
    const t = e.touches[0];
    touchStartX=t.clientX; touchStartY=t.clientY; touchStartTime=Date.now(); swiping=true;
  }, {passive:true});
  document.addEventListener('touchend', (e)=>{
    if(!swiping) return; swiping=false;
    if(!currentNavOrder.includes(view)) return;
    const t = e.changedTouches[0];
    const dx = t.clientX-touchStartX, dy = t.clientY-touchStartY, dt = Date.now()-touchStartTime;
    if(Math.abs(dx)<60 || Math.abs(dy)>60 || dt>600) return;
    const idx = currentNavOrder.indexOf(view);
    if(dx<0 && idx<currentNavOrder.length-1) navigateTo(currentNavOrder[idx+1]);
    else if(dx>0 && idx>0) navigateTo(currentNavOrder[idx-1]);
  }, {passive:true});
})();
